<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SafeVault wallet and Vault AI architecture</title>
  <desc id="desc">Target architecture. SafeVault Homebase is the primary smart account and external wallets are optional separate accounts. Vault AI prepares evidence and handoffs using configured discovery tools. The holder reviews actions and the chosen wallet account authorizes execution. Provider and account implementation choices remain pending.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d4bc3"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #252036; }
      .title { font-size: 46px; font-weight: 700; }
      .sub { font-size: 22px; fill: #625a71; }
      .section { font-size: 19px; letter-spacing: 2px; font-weight: 700; fill: #6d4bc3; }
      .heading { font-size: 27px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #625a71; }
      .panel { fill: #ffffff; stroke: #dad3e8; stroke-width: 2; }
      .flow { fill: none; stroke: #6d4bc3; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8f6fc"/>
  <text x="64" y="82" class="title">SafeVault + Vault AI</text>
  <text x="64" y="122" class="sub">Target architecture · Primary smart account, optional external wallets, evidence-based assistance</text>
  <rect x="64" y="160" width="936" height="674" rx="24" fill="#f0ebfa"/>
  <rect x="1032" y="160" width="504" height="674" rx="24" fill="#f0ebfa"/>
  <text x="96" y="203" class="section">WALLET AND AUTHORIZATION</text>
  <text x="1064" y="203" class="section">WORKSPACE AGENT</text>

  <rect x="96" y="228" width="872" height="132" rx="18" class="panel"/>
  <text x="124" y="270" class="heading">Holder + SafeVault application</text>
  <text x="124" y="306" class="body">Sign in to Homebase · Select account and network · Review the action</text>
  <text x="124" y="338" class="small">Application login, account initialization, and wallet authorization are separate.</text>

  <path d="M 316 360 V 438" class="flow"/>
  <path d="M 750 360 V 438" class="flow"/>
  <text x="344" y="405" class="small">Primary</text>
  <text x="778" y="405" class="small">Optional</text>
  <rect x="96" y="448" width="420" height="172" rx="18" class="panel"/>
  <text x="120" y="490" class="heading">Homebase smart account</text>
  <text x="120" y="530" class="body">Primary BlackVault account</text>
  <text x="120" y="564" class="body">ERC-4337-style execution</text>
  <text x="120" y="598" class="small">Implementation and recovery choices pending</text>
  <rect x="548" y="448" width="420" height="172" rx="18" class="panel"/>
  <text x="572" y="490" class="heading">Connected external wallets</text>
  <text x="572" y="530" class="body">Separate addresses and balances</text>
  <text x="572" y="564" class="body">Each wallet keeps its own authority</text>
  <text x="572" y="598" class="small">Connecting does not move assets or delegate</text>
  <path d="M 306 620 V 672" class="flow"/>
  <path d="M 758 620 V 672" class="flow"/>
  <rect x="96" y="682" width="872" height="120" rx="18" class="panel"/>
  <text x="124" y="724" class="heading">Authorized execution through the selected account</text>
  <text x="124" y="760" class="body">Holder confirmation · Account validation · Submission · Receipt and outcome</text>
  <text x="124" y="788" class="small">Future automation requires separately enabled, limited, revocable permissions.</text>

  <rect x="1064" y="228" width="440" height="166" rx="18" class="panel"/>
  <text x="1088" y="270" class="heading">Vault AI in Botpress</text>
  <text x="1088" y="310" class="body">Knowledge, workflows, tools, cases</text>
  <text x="1088" y="344" class="body">Explain evidence and prepare handoffs</text>
  <text x="1088" y="376" class="small">Agent configuration is the current scope</text>
  <path d="M 1064 286 H 978" class="flow"/>
  <path d="M 1284 472 V 404" class="flow"/>
  <text x="1302" y="440" class="small">Evidence</text>
  <rect x="1064" y="482" width="440" height="206" rx="18" class="panel"/>
  <text x="1088" y="524" class="heading">Discovery and claim checks</text>
  <text x="1088" y="566" class="body">Etherscan / configured provider reads</text>
  <text x="1088" y="602" class="body">Protocol-specific eligibility adapter</text>
  <text x="1088" y="644" class="small">Read-helper source is present.</text>
  <text x="1088" y="672" class="small">Live bindings and first claim support pending.</text>
  <text x="1088" y="744" class="body">Visible asset → Candidate claim</text>
  <text x="1088" y="778" class="body">Validated eligibility → Confirmed result</text>

  <path d="M 532 802 V 870" class="flow"/>
  <path d="M 1520 880 V 606 H 1510" class="flow" stroke-dasharray="7 7"/>
  <rect x="64" y="880" width="1472" height="64" rx="16" fill="#e5dcf5"/>
  <text x="96" y="920" class="body">Blockchain records · Ethereum mainnet recovery / VLT target · Separate Sepolia context for FUN</text>
  <text x="64" y="978" class="small">BlackVault Public Network · 2026-09-18 · Account providers, live services, and deployments retain separate implementation records.</text>
</svg>
